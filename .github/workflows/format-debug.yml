name: Android format capture

on:
  push:
    branches:
      - feature/android-durable-transfer-recovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p apps/android spotlessApply || true
      - name: Commit stable formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/data/DurableUploadRepository.kt \
            apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/data/TransferOperationStore.kt \
            apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/domain/UploadRecoveryRules.kt \
            apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/transfer/FileTransferService.kt \
            apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/transfer/TransferStatusBus.kt \
            apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/ui/HomeScreen.kt \
            apps/android/app/src/test/kotlin/com/shinpstudio/phonetransfer/data/TransferOperationPersistenceTest.kt \
            apps/android/app/src/test/kotlin/com/shinpstudio/phonetransfer/domain/UploadRecoveryRulesTest.kt \
            apps/android/app/src/test/kotlin/com/shinpstudio/phonetransfer/transfer/TransferStatusBusTest.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Android formatter"
          git push origin HEAD:feature/android-durable-transfer-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-formatted-sources
          path: |
            apps/android/app/src/main/kotlin/
            apps/android/app/src/test/kotlin/
