name: Android format capture

on:
  push:
    branches:
      - feature/android-durable-transfer-recovery

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p apps/android spotlessApply
      - uses: actions/upload-artifact@v4
        with:
          name: android-formatted-sources
          path: |
            apps/android/app/src/main/kotlin/
            apps/android/app/src/test/kotlin/
