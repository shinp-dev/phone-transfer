name: Temporary Android formatter

on:
  push:
    branches: ['feature/android-saf-transfer']

permissions:
  contents: write

concurrency:
  group: android-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor == 'shinp-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-saf-transfer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Apply response-loss cleanup hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          repository = Path('apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/data/FileTransferRepository.kt')
          lines = repository.read_text().splitlines()
          upload = lines.index('    suspend fun upload(')
          with_client = lines.index('        withClient(pc) { client ->', upload)
          create = lines.index('                val create =', with_client)
          create_end = lines.index('                    )', create)
          block = lines[create:create_end + 1]
          del lines[create:create_end + 1]
          lines[with_client + 1:with_client + 1] = [line[4:] for line in block]

          catch = lines.index('            } catch (error: Exception) {', with_client)
          old_end = lines.index('                throw error', catch)
          replacement = [
              '            } catch (error: Exception) {',
              '                if (!completed) {',
              '                    withContext(NonCancellable) {',
              '                        try {',
              '                            if (transferId == null) {',
              '                                transferId = createTransferWithResponseRecovery(client, pc, create).transferId',
              '                            }',
              '                            transferId?.let { cancelTransfer(client, pc, it) }',
              '                        } catch (_: Exception) {',
              '                            // Server-side shutdown/recovery cleanup remains the final fallback.',
              '                        }',
              '                    }',
              '                }',
              '                throw error',
          ]
          lines[catch:old_end + 1] = replacement
          repository.write_text('\n'.join(lines) + '\n')

          service = Path('apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/transfer/FileTransferService.kt')
          lines = service.read_text().splitlines()
          timeout = lines.index('    override fun onTimeout(startId: Int, fgsType: Int) {')
          stop = lines.index('        stopSelf(startId)', timeout)
          lines[stop] = '        stopSelf()'
          service.write_text('\n'.join(lines) + '\n')
          PY
      - run: gradle -p apps/android spotlessApply
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/android; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android
          git commit -m "fix(android): close response-loss cleanup races"
          git push origin HEAD:feature/android-saf-transfer
