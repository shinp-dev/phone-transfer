name: Temporary Android formatter

on:
  push:
    branches: ['feature/android-saf-transfer']

permissions:
  contents: write

concurrency:
  group: android-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor == 'shinp-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-saf-transfer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p apps/android spotlessApply
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/android; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android
          git commit -m "style(android): apply spotless formatting"
          git push origin HEAD:feature/android-saf-transfer
