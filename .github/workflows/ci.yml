name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_protocol.py
      - run: python scripts/generate_protocol.py --check
      - run: git diff --check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PhoneTransfer.slnx
      - run: dotnet format PhoneTransfer.slnx --verify-no-changes --no-restore
      - run: dotnet build PhoneTransfer.slnx --configuration Release --no-restore
      - run: dotnet test tests/windows/PhoneTransfer.Tests --configuration Release --no-build --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p apps/android --continue spotlessCheck :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Formatting diagnostics
        if: failure()
        run: |
          set +e
          gradle -p apps/android spotlessApply
          result=$?
          git diff
          exit "$result"
      - name: Print Android lint report
        if: always()
        run: |
          report=apps/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
