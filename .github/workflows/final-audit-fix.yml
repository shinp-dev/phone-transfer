name: One-shot final Android audit fix

on:
  push:
    branches:
      - feature/android-durable-transfer-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply final audit fixes
        run: python .github/scripts/final_audit_fix.py
      - name: Format Android sources
        run: gradle -p apps/android spotlessApply
      - name: Commit final audit fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/ui/HomeViewModel.kt \
                  apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/transfer/TransferStatusBus.kt \
                  apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/transfer/FileTransferService.kt \
                  apps/android/app/src/main/kotlin/com/shinpstudio/phonetransfer/data/TransferOperationStore.kt \
                  apps/android/app/src/test/kotlin/com/shinpstudio/phonetransfer/data/TransferOperationPersistenceTest.kt \
                  apps/android/app/src/test/kotlin/com/shinpstudio/phonetransfer/transfer/TransferStatusBusTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: close final Android recovery audit findings"
          git push
