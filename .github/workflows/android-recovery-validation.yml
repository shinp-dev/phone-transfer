name: Android recovery validation (temporary)
on:
  push:
    branches: [feature/android-durable-transfer-recovery]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p apps/android spotlessApply
      - if: always()
        run: git diff --binary -- apps/android packages/protocol > /tmp/android-format.patch
      - run: gradle -p apps/android spotlessCheck :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-validation
          path: |
            /tmp/android-format.patch
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
